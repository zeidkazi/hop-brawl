name = "hop-brawl"
main = "server/index.ts"
compatibility_date = "2026-10-12"
workers_dev = true

# PREPARED ONLY: do not deploy this route until the owner confirms the zone is Active.
# batch-b2-stable is already deployed to workers.dev without this custom domain.
routes = [{ pattern = "hopbrawl.zeidkazi.in", custom_domain = true }]

[vars]
ALLOWED_ORIGINS = "https://hopbrawl.zeidkazi.in"

[assets]
directory = "./client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Matchmaker"]
