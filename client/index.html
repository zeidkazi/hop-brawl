<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hop Brawl — Cross the road. Shove your friends.</title>
    <style id="loading-style">
      html,body{margin:0;background:__SKY_BOTTOM__} [hidden]{display:none!important}
      #loading{position:fixed;inset:0;z-index:100;overflow:hidden;color:#1B1B2F;font:700 16px/1.4 system-ui,sans-serif;text-align:center}
      .load-scene{position:absolute;inset:0;background:linear-gradient(__SKY_TOP__,__SKY_BOTTOM__);display:grid;place-content:center;justify-items:center;padding:24px;box-sizing:border-box}
      .load-wordmark{width:min(440px,90vw);height:auto;overflow:visible}
      .load-wait{visibility:hidden;animation:load-show 0s __FAST__ms forwards}
      .load-gloves{width:230px;height:130px;overflow:visible;transform-origin:50% 60%}
      .load-left,.load-right{transform-box:fill-box;transform-origin:center;animation:glove-left __TAP__ms infinite}
      .load-right{animation-name:glove-right}
      .load-spark{transform-origin:115px 62px;animation:spark __TAP__ms infinite}
      .load-meter{width:min(300px,78vw);height:24px;border:4px solid #1B1B2F;border-radius:18px;background:#FFF6E5;overflow:hidden;box-shadow:0 4px #1B1B2F;box-sizing:border-box;margin:20px auto 10px}
      .load-fill{height:100%;width:100%;background:#FFD23F;transform:scaleX(0);transform-origin:left}
      .load-percent{margin:8px 0;font-size:14px;font-variant-numeric:tabular-nums}
      .load-tip{max-width:320px;min-height:45px;margin:12px 0 0}
      .load-slow{visibility:hidden;animation:load-show 0s __SLOW__ms forwards;font-size:14px;margin:6px 0}
      #load-error{max-width:320px;margin-top:20px} #load-error p{font-size:21px;margin:10px}
      #load-retry{cursor:pointer;font:800 18px system-ui;border:3px solid #1B1B2F;border-radius:12px;padding:12px 32px;background:#FFD23F;box-shadow:0 5px #1B1B2F;color:#1B1B2F}
      #loading[data-state=error] .load-wait{display:none}
      #loading[data-state=error] .load-left,#loading[data-state=error] .load-right{animation:none}
      .loading-reduced .load-left,.loading-reduced .load-right,.loading-reduced .load-spark{animation:none}.loading-reduced .load-spark{visibility:hidden}
      @keyframes load-show{to{visibility:visible}}
      @keyframes glove-left{0%,100%{transform:translateX(0) rotate(-8deg)}35%{transform:translateX(22px) rotate(5deg)}55%{transform:translateX(-5px) rotate(-12deg)}}
      @keyframes glove-right{0%,100%{transform:translateX(0) rotate(8deg)}35%{transform:translateX(-22px) rotate(-5deg)}55%{transform:translateX(5px) rotate(12deg)}}
      @keyframes spark{0%,25%,65%,100%{opacity:0;transform:scale(.3)}35%{opacity:1;transform:scale(1)}}
      @media(prefers-reduced-motion:reduce){.load-left,.load-right,.load-spark{animation:none}.load-spark{visibility:hidden}}
    </style>
  </head>
